server {
    listen 80;
    server_name _;

    # RN-13: el backend acepta hasta 12MB de request (max-request-size).
    # Si nginx corta antes, el usuario recibe un 413 crudo en vez del
    # error ARCHIVO_NO_PERMITIDO que devuelve tu validador.
    client_max_body_size 12M;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: cualquier ruta que no sea un archivo real
    # devuelve index.html para que el router del navegador la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El frontend llama a /api/v1/... y nginx lo reenvia al backend
    # por la red interna de Docker. Como navegador y API comparten
    # origen, CORS deja de intervenir.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Swagger NO se proxea: application-prod.yml lo deshabilita a proposito
    # (spec.md §1.1). Para verlo, usa el perfil dev con run-dev.sh.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
