# Perfil de producción. Se activa con SPRING_PROFILES_ACTIVE=prod.
#
# Este archivo no contiene ningún valor secreto: todo dato sensible llega por variable de entorno
# (Agente.md §6.2: nunca credenciales en el código). Las variables sin valor por defecto son
# deliberadas — si falta una, la aplicación no arranca, que es mejor que arrancar apuntando a la
# configuración de desarrollo. La copia de referencia versionada es application-prod.yml.example.

# spec.md §1.1: la documentación de la API se expone solo en dev. Acá /swagger-ui.html y
# /v3/api-docs devuelven 404: publicar la estructura completa de la API en la instalación de un
# laboratorio no aporta valor y aumenta la superficie de ataque.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  datasource:
    # Sin defaults de localhost: en producción el destino se declara siempre.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  jpa:
    hibernate:
      # Agente.md §5.8: el esquema lo gobierna Flyway. Repetido acá a propósito: es la línea
      # que más caro sale equivocar en producción.
      ddl-auto: validate
  mail:
    # §6.3 y §3.1.b: con SMTP real, el correo de credenciales y las notificaciones salen de verdad.
    # Los timeouts de conexión se heredan de application.yml.
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  laboratorio:
    # CU-02/CU-10: huso del laboratorio, con el que se corta "entregadas esta semana". Sin default
    # a propósito: en producción el huso es un dato del laboratorio y no se adivina.
    zona-horaria: ${LAB_ZONA_HORARIA}
  almacenamiento:
    # RN-13: ruta absoluta y fuera del directorio de la aplicación, para que un redespliegue
    # no se lleve puestos los adjuntos.
    directorio: ${ALMACENAMIENTO_DIRECTORIO}
  cors:
    # Solo el dominio del laboratorio. El default de desarrollo (localhost:5173) no rige acá.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  notificaciones:
    correo:
      remitente: ${MAIL_REMITENTE}

logging:
  level:
    # Agente.md §8.7: nunca loguear contraseñas, tokens ni el nombre del paciente. En DEBUG,
    # Hibernate y Spring Security imprimen parámetros de consulta y datos de sesión, así que
    # los niveles finos quedan fuera de producción.
    root: INFO
    com.labgarcias: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

# ---------------------------------------------------------------------
# Ajustes para ejecución en contenedor detrás de nginx.
# ---------------------------------------------------------------------
server:
  # nginx hace de proxy: sin esto la app ve la IP del contenedor de nginx
  # en vez de la del cliente, y arma mal las URLs absolutas.
  forward-headers-strategy: framework
  # Al redesplegar, deja terminar las requests en curso antes de cerrar.
  shutdown: graceful


# Healthcheck del contenedor. Solo /actuator/health, nada más expuesto.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # CRÍTICO: sin esto, actuator agrega un indicador que intenta conectarse
    # al SMTP en cada chequeo. Con el correo no configurado o el servidor caído,
    # /actuator/health devuelve DOWN, Docker marca el contenedor unhealthy y
    # el frontend nunca arranca. Un SMTP inalcanzable no significa que la
    # aplicación esté caída: §6 criterio 2 dice justamente lo contrario.
    mail:
      enabled: false
