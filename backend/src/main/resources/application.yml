spring:
  application:
    name: backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/labgarcias_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    # CU-01: 8 horas de sesión (confirmado con el desarrollador; no está en spec.md).
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:480}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
