# ============================================================
#  Stack de DESPLIEGUE de Lab Garcia's Connect
#
#  Aislado por completo del stack de desarrollo:
#    - otro nombre de proyecto  -> labgarcias-app
#    - otros nombres de contenedor
#    - OTRO VOLUMEN de datos    -> labgarcias_pgdata_app
#    - otro puerto de Postgres  -> 5437 (dev sigue en 5436)
#
#  Podes tener los dos corriendo a la vez sin que se pisen.
#
#  Uso:  cd deploy && docker compose up -d --build
# ============================================================
name: labgarcias-app

services:

  db:
    image: postgres:15.8
    container_name: labgarcias_db_app
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${LAB_ZONA_HORARIA:-America/Montevideo}
    ports:
      # Expuesto solo para que puedas conectarte con DBeaver/psql.
      # Si no lo necesitas, borra estas dos lineas: el backend le llega
      # igual por la red interna.
      - "127.0.0.1:${DB_PORT_HOST:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: labgarcias-backend:local
    container_name: labgarcias_backend_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Dentro de la red de Docker el host es el nombre del servicio ("db")
      # y el puerto es el interno (5432), no el 5437 del host.
      DB_HOST: db
      DB_PORT: 5432
      # El backend necesita DB_NAME por separado: application-prod.yml lo usa
      # para armar la URL JDBC. No alcanza con darselo solo al servicio db.
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACION_MINUTOS: ${JWT_EXPIRACION_MINUTOS:-480}

      LAB_ZONA_HORARIA: ${LAB_ZONA_HORARIA:-America/Montevideo}
      TZ: ${LAB_ZONA_HORARIA:-America/Montevideo}

      # Ruta ABSOLUTA dentro del contenedor, montada en un volumen.
      # Si quedara en "./archivos" se perderia en cada redeploy.
      ALMACENAMIENTO_DIRECTORIO: /app/archivos

      # El navegador entra por http://localhost:${APP_PORT} y desde ahi
      # nginx proxea la API, asi que en la practica es mismo origen.
      # Se deja igual por si algun dia expones el backend directo.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090}

      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_REMITENTE: ${MAIL_REMITENTE:-no-responder@labgarcias.local}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_POLLING_MS: ${TELEGRAM_POLLING_MS:-5000}

      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m}
    volumes:
      - archivos:/app/archivos
    # Requiere spring-boot-starter-actuator en el pom.xml y
    # "/actuator/health/**" agregado a RUTAS_PUBLICAS en SecurityConfig.
    # wget viene con busybox en la imagen alpine, no hace falta instalar nada.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Margen para el arranque de la JVM + Flyway en una notebook.
      start_period: 90s
    # El backend NO publica puerto al host. Solo nginx lo alcanza.
    # Para debuggear, descomenta:
    # ports:
    #   - "127.0.0.1:8081:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: labgarcias-frontend:local
    container_name: labgarcias_frontend_app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"

volumes:
  pgdata:
    name: labgarcias_pgdata_app
  archivos:
    name: labgarcias_archivos_app
